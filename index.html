<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>방명록</title>
<style>
  :root {
    --bg: #f6f7fb; --card: #ffffff; --text: #1f2430; --muted: #6b7280;
    --line: #e5e7ee; --accent: #4f6bed; --accent-text: #ffffff;
    --bubble: #eef1ff; --bubble-text: #26304f; --danger: #c0392b; --danger-bg: #fdecea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141a; --card: #1c1f28; --text: #e8eaf0; --muted: #9aa1b2;
      --line: #2c3040; --accent: #7a90ff; --accent-text: #10131c;
      --bubble: #262c47; --bubble-text: #dfe5ff; --danger: #ff8a7a; --danger-bg: #3a2220;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 16px 4rem; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; line-height: 1.55;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { margin: 0 0 .25rem; font-size: 1.6rem; }
  .sub { margin: 0 0 1.25rem; color: var(--muted); font-size: .95rem; }

  .model-picker { display: flex; align-items: center; gap: .6rem; margin: 0 0 1rem; }
  .model-picker label { font-size: .9rem; color: var(--muted); white-space: nowrap; }
  select {
    flex: 1; min-width: 0; font: inherit; color: inherit; padding: .5rem .6rem;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  }
  select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .model-tag { display: block; margin-top: .3rem; font-size: .75rem; color: var(--muted); font-style: normal; }

  form, li { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 1rem; }
  form { display: flex; flex-direction: column; gap: .6rem; margin-bottom: 1.5rem; }
  input, button { font: inherit; color: inherit; }
  input {
    width: 100%; padding: .65rem .75rem; background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px;
  }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .msg-row { position: relative; }
  .msg-row input { padding-right: 4rem; }
  .count { position: absolute; right: .75rem; top: 50%; transform: translateY(-50%); font-size: .8rem; color: var(--muted); }
  button {
    padding: .7rem; border: 0; border-radius: 10px; cursor: pointer; font-weight: 600;
    background: var(--accent); color: var(--accent-text);
  }
  button:disabled { opacity: .55; cursor: wait; }
  .error { margin: 0; min-height: 1.3em; color: var(--danger); font-size: .9rem; }

  ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: .75rem; }
  .meta { display: flex; justify-content: space-between; gap: .5rem; font-size: .85rem; color: var(--muted); }
  .meta strong { color: var(--text); }
  .msg { margin: .3rem 0 0; word-break: break-word; }
  .bubble {
    margin: .7rem 0 0 .9rem; padding: .55rem .8rem; border-radius: 4px 14px 14px 14px;
    background: var(--bubble); color: var(--bubble-text); word-break: break-word;
  }
  .bubble.waiting { color: var(--muted); font-style: italic; }
  .dots span { animation: blink 1.2s infinite both; }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
  .bubble.failed { background: var(--danger-bg); color: var(--danger); font-size: .88rem; }
  .bubble.none { background: transparent; border: 1px dashed var(--line); color: var(--muted); font-size: .88rem; }
  .empty { text-align: center; color: var(--muted); padding: 2rem 0; }
  @media (prefers-reduced-motion: reduce) { .dots span { animation: none; } }
</style>
</head>
<body>
<main>
  <h1>방명록</h1>
  <p class="sub">한 줄을 남기면 AI가 답글을 달아 드려요.</p>

  <div class="model-picker">
    <label for="model">AI 모델</label>
    <select id="model"></select>
  </div>

  <form id="form">
    <input id="name" placeholder="이름" maxlength="20" autocomplete="off" aria-label="이름">
    <div class="msg-row">
      <input id="message" placeholder="한 줄 글 (200자까지)" maxlength="200" autocomplete="off" aria-label="한 줄 글">
      <span class="count" id="count">0/200</span>
    </div>
    <button id="submit" type="submit">남기기</button>
    <p class="error" id="error" role="alert"></p>
  </form>

  <ul id="list" aria-live="polite"></ul>
  <p class="empty" id="empty" hidden>아직 글이 없어요. 첫 글을 남겨 보세요!</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://bkebbwsfwcnrrhbkrtyt.supabase.co";
  const SUPABASE_KEY = "sb_publishable_7gPnaBYMNoPONKPkaYI6tw_9CwgTQDd"; // 공개용 키
  const WAIT_LIMIT_MS = 60_000; // 이 시간이 지나도 답글이 없으면 "답글이 없습니다"
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // 함수(supabase/functions/ai-reply)의 허용 목록과 같아야 한다.
  const MODELS = [
    { id: "nvidia/nemotron-3-ultra-550b-a55b:free", label: "Nemotron 3 Ultra (기본)" },
    { id: "google/gemma-4-31b-it:free", label: "Gemma 4 31B" },
    { id: "google/gemma-4-26b-a4b-it:free", label: "Gemma 4 26B" },
    { id: "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free", label: "Nemotron 3 Nano Omni" },
  ];
  const modelLabel = (id) => MODELS.find((m) => m.id === id)?.label ?? id;

  const $ = (id) => document.getElementById(id);
  const nameEl = $("name"), msgEl = $("message"), errEl = $("error");

  const modelEl = $("model");
  for (const m of MODELS) modelEl.append(new Option(m.label, m.id));
  try {
    const saved = localStorage.getItem("guestbook-model");
    if (MODELS.some((m) => m.id === saved)) modelEl.value = saved;
  } catch (_) { /* 저장소를 못 써도 괜찮다 */ }
  modelEl.addEventListener("change", () => {
    try { localStorage.setItem("guestbook-model", modelEl.value); } catch (_) {}
  });

  let entries = [];
  const pending = new Set(); // 이 화면에서 함수 응답을 기다리는 글 id

  function relTime(iso) {
    const sec = Math.max(0, (Date.now() - new Date(iso)) / 1000);
    if (sec < 60) return "방금";
    if (sec < 3600) return `${Math.floor(sec / 60)}분 전`;
    if (sec < 86400) return `${Math.floor(sec / 3600)}시간 전`;
    return new Date(iso).toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric" });
  }

  function isWaiting(e) {
    if (e.ai_reply || e.ai_error) return false;
    return pending.has(e.id) || Date.now() - new Date(e.created_at) < WAIT_LIMIT_MS;
  }

  function bubble(cls, text) {
    const b = document.createElement("p");
    b.className = "bubble " + cls;
    b.textContent = text;
    return b;
  }

  function render() {
    $("empty").hidden = entries.length > 0;
    $("list").replaceChildren(...entries.map((e) => {
      const li = document.createElement("li");

      const meta = document.createElement("div");
      meta.className = "meta";
      const who = document.createElement("strong");
      who.textContent = e.name;
      const when = document.createElement("time");
      when.dateTime = e.created_at;
      when.textContent = relTime(e.created_at);
      meta.append(who, when);

      const p = document.createElement("p");
      p.className = "msg";
      p.textContent = e.message;
      li.append(meta, p);

      if (e.ai_reply) {
        const b = bubble("", "🤖 " + e.ai_reply);
        if (e.ai_model) {
          const tag = document.createElement("em");
          tag.className = "model-tag";
          tag.textContent = modelLabel(e.ai_model);
          b.append(tag);
        }
        li.append(b);
      } else if (e.ai_error) {
        li.append(bubble("failed", "AI 답글을 못 받았어요: " + e.ai_error));
      } else if (isWaiting(e)) {
        const b = bubble("waiting", "AI가 쓰는 중");
        const dots = document.createElement("span");
        dots.className = "dots";
        dots.innerHTML = "<span>.</span><span>.</span><span>.</span>"; // 고정 문자열만 사용
        b.append(dots);
        li.append(b);
      } else {
        li.append(bubble("none", "답글이 없습니다"));
      }
      return li;
    }));
  }

  async function load() {
    const { data, error } = await db.from("guestbook_entries")
      .select("*").order("created_at", { ascending: false }).limit(50);
    if (error) { errEl.textContent = "목록을 불러오지 못했어요: " + error.message; return; }
    entries = data;
    render();
  }

  async function requestReply(id, model) {
    pending.add(id);
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/ai-reply`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id, model }),
        signal: AbortSignal.timeout(40_000),
      });
      if (res.status >= 500) throw new Error("함수 오류 " + res.status);
    } catch (e) {
      errEl.textContent = "AI 답글 요청에 실패했어요: " + e.message;
    } finally {
      pending.delete(id);
      await load();
    }
  }

  msgEl.addEventListener("input", () => { $("count").textContent = `${msgEl.value.length}/200`; });

  $("form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    errEl.textContent = "";
    const name = nameEl.value.trim(), message = msgEl.value.trim();
    if (!name || name.length > 20) { errEl.textContent = "이름은 1~20자로 적어 주세요."; return; }
    if (!message || message.length > 200) { errEl.textContent = "글은 1~200자로 적어 주세요."; return; }

    $("submit").disabled = true;
    const { data: saved, error } = await db.from("guestbook_entries")
      .insert({ name, message }).select("id").single();
    $("submit").disabled = false;
    if (error) { errEl.textContent = "저장하지 못했어요: " + error.message; return; }

    msgEl.value = "";
    $("count").textContent = "0/200";
    msgEl.focus();
    pending.add(saved.id);           // 목록에 먼저 "AI가 쓰는 중…"으로 나타나게 한다
    await load();
    requestReply(saved.id, modelEl.value); // 기다리지 않음: 그동안 다른 글도 쓸 수 있다
  });

  // 시각 갱신, 그리고 다른 곳에서 처리 중인 글(새로고침 등)의 답글을 가져오기
  setInterval(() => {
    if (entries.some(isWaiting) && pending.size === 0) load(); else render();
  }, 5000);

  load();
</script>
</body>
</html>
